# Depdep has no RUNTIME dependencies (spec/01-goals-and-scope.md#zero-runtime-deps)
# and one dev/test one: `surfex`, which holds `spec/` to the code it describes
# (#112). So there is now something to fetch and something to cache — the
# pipeline is fetch + compile + format + test + the relation check.
default:
  image: hexpm/elixir:1.20.4-erlang-29.0.5-debian-bookworm-20260824
  interruptible: true
  before_script:
    # The image ships no git, and the runner clones with its own, outside this
    # container — so nothing needed one until Depdep.Provider.GitTest started
    # shelling out to it. Those tests are what stands between a restored mirror
    # and `git fsck` rejecting it, so install git rather than exclude them.
    - apt-get update && apt-get install -y --no-install-recommends git
    - mix local.hex --force && mix local.rebar --force
    # `surfex` comes from hex (#129), so there is no credential rewrite here. It
    # used to be a `git@host:` dependency, which a runner cannot fetch — no ssh
    # key in the container — and that needed two `url.…insteadOf` lines plus
    # `dco-tek/depdep` on `dco-tek/surfex`'s inbound job-token allowlist, granted
    # by hand in #113 and invisible in this repository.
    #
    # That grant is deliberately NOT revoked: another project may rely on it, and
    # removing an allowlist entry on a sibling is not depdep's call. depdep simply
    # no longer needs it.
    - mix deps.get

# `deps/` is one git checkout pinned by `mix.lock`; `_build` is deliberately not
# cached, because a stale build directory is how a green pipeline hides a
# compile error.
cache:
  key:
    files: [mix.lock]
  paths: [deps/]

variables:
  MIX_ENV: test
  # See the note in dco-tek/bizex's .gitlab-ci.yml: ERTS sizes the port table
  # from the file-descriptor limit, and the runner's containers inherit an
  # effectively infinite `nofile`, so every BEAM allocates ~1.5 GB before
  # running an instruction.
  ERL_MAX_PORTS: "65536"

stages: [test, store, publish]

test:
  stage: test
  script:
    - mix format --check-formatted
    - mix compile --warnings-as-errors
    - mix test
    # The metresis profile (priv/profiles/depdep.exs) is held to what the code
    # emits, both ways — a metric added without it would post as a bare
    # provisional again (#69). The suite runs the same check; this is the line
    # a reader of a red pipeline sees.
    - mix depdep.profile check
    # The package metadata and its file list (mix.exs package/0) are held to
    # what hex accepts, so `mix hex.publish` cannot be the first thing to find
    # a field missing (#75). Builds a tarball and writes nothing else.
    - mix hex.build --output /tmp/depdep-package.tar

# `spec/` held to the code it describes (#112, #113). Its own job rather than a
# line in `test:`, so a red relation reads as "the spec and the code disagree"
# instead of hiding among compile and test output.
#
# A HARD gate, and since #120 it gates the whole claim:
#
#   * every recorded relation still holds, or somebody has confirmed it again;
#   * `require: [code: [:implements]]` — every public item is described by a
#     section, so adding a function without describing it fails here;
#   * `require: [test_hint: [:verifies]]` — every test hint has a test;
#   * `RELATIONS.md` matches, and the log's chain verifies.
#
# `triangle:` is deliberately NOT `:fail` — see `spec/10-decisions.md#the-gate`
# and the note in `.surfex.exs`. It is reported in this job's output instead.
#
# Both `require:` keys were proven to bite before being set: an undescribed
# public function and an unverified hint each fail the check.
surfex:
  stage: test
  script:
    # Every relation in the log: still current, or changed and awaiting a
    # judgement (`mix surfex.confirm`, one named id at a time).
    - mix surfex.status
    # RELATIONS.md is the committed record. Regenerating must be a no-op; a
    # difference means somebody edited the golden or forgot to regenerate it.
    - mix surfex.goldens
    # The log is an append-only chain. This catches an edited line, a missing
    # parent, or a chain broken by a bad merge resolution.
    - mix surfex.log --verify

# What the instance actually holds, against what this depdep ships (#103).
#
# **Advisory, on purpose, and here is the condition for making it a gate.**
# It found real drift the first time it could reach cn2: the instance's
# PROFILE is the old one, even though its catalogue was repaired by hand
# (#100). Nothing in this repository can fix that — the document reaches an
# instance through the data path (a 428 on ingest, #87), which needs a tagged
# depdep carrying the handshake AND the `profile` capability on the CI token.
# Until both exist, failing the build here would block every unrelated change
# for a reason no commit can address, which is worse than an amber job.
#
# Flip `allow_failure` to false the day this job passes on main.
profile-instance-check:
  stage: test
  allow_failure: true
  script:
    - mix depdep.profile check --instance

# The claim #14 shipped without: that `apt-get install` USES a restored `.deb`
# rather than re-fetching it. #41 recorded it as untakeable — "no MinIO was
# reachable and the environment was not root" — which is false of this job: it
# runs as root, and it can run a store beside it.
#
# **The store here is a mock, and that is on purpose.** MinIO cannot be had
# any more: `minio/minio` is gone from Docker Hub ("repository does not
# exist"), `quay.io/minio/minio` answers unauthorized, and
# `dl.min.io/.../minio` returns 410 — all three checked in this job's own
# history (#105, and see the proposal on what that means for the README).
# `adobe/s3mock` hands objects back and takes `initialBuckets`, which is all
# this job needs: what is under test is apt's behaviour, not the store's. It
# does NOT validate signatures, so nothing here is evidence about Signature
# v4 — the reclamation job (#106) needs a server that does, and picks one. The
# seaweedfs job (#182) adds the other half: a server a reader can actually obtain
# and run, which is what the guide is allowed to recommend.
.store:
  stage: store
  services:
    - name: adobe/s3mock
      alias: s3
  variables:
    # The URL form (#88) driving a real HTTP server for the first time.
    DEPDEP_STORE: "s3://depdep@s3:9090/depdep-ci"
  before_script:
    # depdep's own CI uses ITS store, never the group's. The dco-tek group defines
    # the separate variables unprotected and unscoped (eight consumers share one
    # store), so every job inherits them — and depdep refuses two config forms
    # rather than guessing which was meant (#148).
    #
    # `unset`, NOT `VAR: ""` in `variables:`. **Project and group CI variables take
    # precedence over a job's own `variables:`**, which is the opposite of the
    # intuition and is documented GitLab behaviour — setting it to "" in the YAML
    # changed nothing and the job still saw the group's value. before_script and
    # script share one shell, so unsetting here reaches every command below.
    #
    # All four, though only DEPDEP_ACCESS_KEY conflicts today: centralising
    # DEPDEP_ENDPOINT and DEPDEP_BUCKET at group level is the sensible thing for a
    # shared store and would break these jobs identically. DEPDEP_SECRET_KEY is
    # deliberately kept — it is not one of the separate variables, both forms use
    # it, and each job sets its own.
    - unset DEPDEP_ENDPOINT DEPDEP_BUCKET DEPDEP_ACCESS_KEY DEPDEP_REGION
    # DEPDEP_SECRET_KEY is a group variable as well, so `variables:` cannot set it
    # either — it has to be exported here, after the unset. This is the same trap
    # twice: the access key broke `one_form/0` loudly, while the secret produced
    # `SignatureDoesNotMatch` only on the server that checks signatures. The apt
    # job passed with the wrong secret because adobe/s3mock does not validate them,
    # which is noted above and is exactly why reclamation uses s3proxy.
    - export DEPDEP_SECRET_KEY=depdep-ci-secret
    # Debian images delete a downloaded .deb the moment it is unpacked, which
    # would empty the archives directory before the push could see it. The
    # same line metresis and uficap already carry.
    - rm -f /etc/apt/apt.conf.d/docker-clean
    - apt-get update
    - apt-get install -y --no-install-recommends git curl
    - mix local.hex --force && mix local.rebar --force
    # Repeated, not inherited: a job's `before_script` REPLACES the default's,
    # so the fetch there does not reach this job (#124). It passed once on a
    # cache hit, which is exactly why the line has to be here — a cache is an
    # optimisation and must never be load-bearing for correctness.
    - mix deps.get
    - |
      for _ in $(seq 1 60); do
        curl -sf http://s3:9090/ > /dev/null 2>&1 && break
        sleep 1
      done
      # The bucket, explicitly. `initialBuckets` did not take (this image
      # reads it under some other name), and an unsigned PUT works precisely
      # because s3mock does not check authorization — the same property that
      # makes it useless as evidence about signing, said plainly here.
      curl -sf -X PUT http://s3:9090/depdep-ci

apt-round-trip:
  extends: .store
  variables:
    PKGS: tree
  script:
    # 1. Fill the archives directory, and prove the assertion discriminates:
    #    a fetch from Debian DOES print `Get:` lines. If this control ever
    #    stops printing them, step 4 proves nothing.
    - apt-get install -d -y $PKGS 2>&1 | tee /tmp/download.log
    - grep -q '^Get:' /tmp/download.log
    - test -n "$(ls /var/cache/apt/archives/*.deb 2>/dev/null)"

    # 2. Into the store, and out of the cache.
    #
    #    The push's own output is asserted, because a store depdep declines to use
    #    makes it skip and exit 0 — "nothing will break", which is the right answer
    #    for a consumer and the wrong one in a test OF the store. Without this the
    #    first sign is the restore finding no .deb, three steps and one misleading
    #    message away from the cause (#148).
    - mix run -e 'Depdep.CLI.main(["--push", "--provider", "apt"])' 2>&1 | tee /tmp/push.log
    - "! grep -q 'store not configured' /tmp/push.log"
    - grep -qE 'uploaded [1-9]' /tmp/push.log
    - rm -f /var/cache/apt/archives/*.deb

    # 3. Back from the store.
    - mix run -e 'Depdep.CLI.main(["--pull", "--provider", "apt", "--package", "tree"])'
    - test -n "$(ls /var/cache/apt/archives/*.deb 2>/dev/null)"

    # 4. The claim: apt installs from what depdep restored, fetching nothing.
    #    `Setting up` too, so "no Get:" cannot pass because nothing installed.
    - apt-get install -y $PKGS 2>&1 | tee /tmp/install.log
    - "! grep -q '^Get:' /tmp/install.log"
    - grep -q 'Setting up tree' /tmp/install.log

    # These have existed since #14 and have never run anywhere: `mix test`
    # excludes them so the suite stays hermetic on a machine with no apt.
    - mix test --include apt_integration

# #28 shipped saying reclamation had never seen a live bucket, and #41 has
# carried it since. This runs it against a real S3 server, across a page
# boundary — the one thing the socket tests cannot reach, because a second
# page means a continuation token and its query-parameter signing.
#
# **s3proxy, not the apt job's s3mock, and the difference is the point:**
# s3proxy enforces Signature v4 (`S3PROXY_AUTHORIZATION: aws-v4`), so a
# mis-signed continuation token answers 403 here instead of being waved
# through. MinIO would have been the obvious choice and cannot be obtained
# at all any more (#107). The bucket is a directory under the filesystem
# backend's base dir, made before the server starts.
reclamation:
  stage: store
  services:
    - name: andrewgaul/s3proxy
      alias: s3
      entrypoint: ["/bin/sh", "-c"]
      command: ["mkdir -p /data/depdep-ci && exec /opt/s3proxy/run-docker-container.sh"]
  variables:
    S3PROXY_AUTHORIZATION: aws-v4
    S3PROXY_IDENTITY: depdep
    S3PROXY_CREDENTIAL: depdep-ci-secret
    S3PROXY_ENDPOINT: "http://0.0.0.0:80"
    JCLOUDS_PROVIDER: filesystem
    JCLOUDS_FILESYSTEM_BASEDIR: /data
    DEPDEP_STORE: "s3://depdep@s3:80/depdep-ci"
  before_script:
    # depdep's own CI uses ITS store, never the group's. The dco-tek group defines
    # the separate variables unprotected and unscoped (eight consumers share one
    # store), so every job inherits them — and depdep refuses two config forms
    # rather than guessing which was meant (#148).
    #
    # `unset`, NOT `VAR: ""` in `variables:`. **Project and group CI variables take
    # precedence over a job's own `variables:`**, which is the opposite of the
    # intuition and is documented GitLab behaviour — setting it to "" in the YAML
    # changed nothing and the job still saw the group's value. before_script and
    # script share one shell, so unsetting here reaches every command below.
    #
    # All four, though only DEPDEP_ACCESS_KEY conflicts today: centralising
    # DEPDEP_ENDPOINT and DEPDEP_BUCKET at group level is the sensible thing for a
    # shared store and would break these jobs identically. DEPDEP_SECRET_KEY is
    # deliberately kept — it is not one of the separate variables, both forms use
    # it, and each job sets its own.
    - unset DEPDEP_ENDPOINT DEPDEP_BUCKET DEPDEP_ACCESS_KEY DEPDEP_REGION
    # DEPDEP_SECRET_KEY is a group variable as well, so `variables:` cannot set it
    # either — it has to be exported here, after the unset. This is the same trap
    # twice: the access key broke `one_form/0` loudly, while the secret produced
    # `SignatureDoesNotMatch` only on the server that checks signatures. The apt
    # job passed with the wrong secret because adobe/s3mock does not validate them,
    # which is noted above and is exactly why reclamation uses s3proxy.
    - export DEPDEP_SECRET_KEY=depdep-ci-secret
    - apt-get update && apt-get install -y --no-install-recommends git curl
    - mix local.hex --force && mix local.rebar --force
    # See the note in apt-round-trip: an overriding `before_script` replaces the
    # default's, so this job must fetch for itself (#124).
    - mix deps.get
    - |
      for _ in $(seq 1 60); do
        curl -s -o /dev/null http://s3:80/ && break
        sleep 1
      done
      curl -s -o /dev/null -w 's3proxy answers %{http_code}\n' http://s3:80/
  script:
    # Over a thousand objects, so the listing pages and the continuation
    # token is signed for real.
    - mix run ci/fill_store.exs

    # --report: the first honest look at a store's contents (#10's inventory).
    #
    # **These assertions used to encode the defect they were written beside** (#125/#169).
    # The job was added after `group/1`'s `"v2"` literal had already stopped matching under
    # `v3`, so "ten lines of 105" was the buggy output taken as the baseline — and the job
    # went green on it for as long as the defect lasted. The report groups by
    # `Depdep.Sweep.rule_for/1` now, so there is one mix row.
    #
    # One row of 1050 is also the stronger assertion: it names the whole prefix's size and
    # its reachable count, which is the number an operator actually reads.
    - mix run -e 'Depdep.CLI.main(["--report"])' 2>&1 | tee /tmp/report.log
    - grep -qE '1 roots, 1 written in the last' /tmp/report.log
    - test "$(grep -c '^depdep:.v3/pkg' /tmp/report.log)" = 0
    - test "$(grep -cE '^depdep:.v3\s' /tmp/report.log)" = 1
    - grep -qE '1050 objects.*10 reachable, 1040 not' /tmp/report.log

    # --sweep without --confirm removes nothing.
    #
    # `--grace 0` leaves nothing protected, which is what it reads like. It used to need
    # `-1`: the comparison was `<=` over WHOLE days, so every object here — seconds old,
    # therefore 0 days old — sat inside a 0-day window. This job is what found that, on the
    # first run of --sweep against a store, and #108/#170 fixed it. **The job is now its
    # regression test**: if the boundary ever goes back to inclusive, all 1051 objects are
    # protected, nothing is deleted, and the three assertions below fail.
    #
    # The total line is also the page-boundary evidence: 1051 objects came
    # back from a listing that caps at 1000 per page.
    - mix run -e 'Depdep.CLI.main(["--sweep", "--grace", "0"])' 2>&1 | tee /tmp/dry.log
    - grep -qE '1051 objects, 1 current roots, 0 within the 0-day grace period' /tmp/dry.log
    - grep -q 'would delete' /tmp/dry.log
    - grep -qE '1040 objects would be removed' /tmp/dry.log
    # Through a file, not a pipe into `grep -q`: under pipefail an early-
    # exiting reader makes the writer die of SIGPIPE and the job fails at
    # random (the lesson bizex's CI already carries).
    - mix run -e 'Depdep.CLI.main(["--report"])' 2>&1 | tee /tmp/report2.log
    - grep -qE '1050 objects' /tmp/report2.log

    # And with it, exactly what no root names.
    # --bucket is the fourth rail (#150): --confirm names the store it will change,
    # and depdep refuses if that is not the configured one. This job is the rail's
    # example rather than an exception to it — and it is the invocation that would
    # have caught the misconfiguration in #148 at the command, not at the store.
    - mix run -e 'Depdep.CLI.main(["--sweep", "--grace", "0", "--confirm", "--bucket", "depdep-ci"])' 2>&1 | tee /tmp/sweep.log
    - grep -qE 'removed 1040 of 1040' /tmp/sweep.log
    - mix run -e 'Depdep.CLI.main(["--report"])' 2>&1 | tee /tmp/after.log
    # Ten objects survive — one per package, the one each root names — and they are now
    # one row rather than ten (#169).
    - grep -qE '^depdep:.v3\s+10 objects.*10 reachable, 0 not' /tmp/after.log

# **An obtainable, self-hostable store** (#182, for #107). The guide told a reader to run
# MinIO, which cannot be obtained any more: `minio/minio` is gone from Docker Hub,
# quay.io answers 401, and dl.min.io returns a deliberate HTTP 410. The two other store
# jobs run adobe/s3mock and andrewgaul/s3proxy — both test doubles, neither something to
# put a team's build cache in. So depdep had never run against a real self-hostable object
# store other than MinIO, and #107 is explicit that recommending an untested server would
# repeat the defect in a new place.
#
# SeaweedFS is the most widely deployed of the obtainable ones and serves S3 from a single
# container. The service writes an identity config before exec'ing, the same shape the
# reclamation job uses for s3proxy, and creates the bucket: depdep never creates one,
# deliberately, because the identity it asks for holds Get and Put and nothing else.
seaweedfs:
  stage: store
  services:
    - name: chrislusf/seaweedfs
      alias: s3
      entrypoint: ["/bin/sh", "-c"]
      command:
        - |
          printf '%s' '{"identities":[{"name":"depdep","credentials":[{"accessKey":"depdep","secretKey":"depdep-ci-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /etc/s3.json
          weed server -s3 -s3.config=/etc/s3.json -dir=/data -ip=0.0.0.0 &
          until wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null 2>&1; do sleep 1; done
          echo 's3.bucket.create -name depdep-ci' | weed shell >/dev/null 2>&1 || true
          wait
  variables:
    DEPDEP_STORE: "s3://depdep@s3:8333/depdep-ci"
  before_script:
    # The same two traps as the other store jobs (#148): group variables outrank a job's
    # own `variables:`, so the separate form is unset here rather than blanked in YAML,
    # and DEPDEP_SECRET_KEY is exported because it is a group variable too.
    - unset DEPDEP_ENDPOINT DEPDEP_BUCKET DEPDEP_ACCESS_KEY DEPDEP_REGION
    - export DEPDEP_SECRET_KEY=depdep-ci-secret
    - apt-get update && apt-get install -y --no-install-recommends git curl
    - mix local.hex --force && mix local.rebar --force
    - mix deps.get
    - |
      for _ in $(seq 1 90); do
        curl -s -o /dev/null http://s3:8333/ && break
        sleep 1
      done
      curl -s -o /dev/null -w 'seaweedfs answers %{http_code}\n' http://s3:8333/
  script:
    # **The job proves its own value first.** A store job against a server that does not
    # check signatures is evidence of nothing — adobe/s3mock accepted a wrong secret for
    # months and that is how #148's misconfiguration reached production unnoticed. So:
    # a deliberately wrong secret must FAIL here before anything else is believed.
    - |
      DEPDEP_SECRET_KEY=wrong-on-purpose mix run -e 'Depdep.CLI.main(["--report"])' > /tmp/wrong.log 2>&1 || true
      grep -qiE 'signature|403|forbidden|denied' /tmp/wrong.log
      echo "signature validation confirmed: a wrong secret is refused"

    # Over a thousand objects, so the listing pages and the continuation token is signed
    # for real — one of the three things the guide now says a store must do.
    - mix run ci/fill_store.exs
    - mix run -e 'Depdep.CLI.main(["--report"])' 2>&1 | tee /tmp/report.log
    - grep -qE '1 roots, 1 written in the last' /tmp/report.log
    - grep -qE '1050 objects.*10 reachable, 1040 not' /tmp/report.log

    # And a confirmed sweep, so Delete is exercised against this server too.
    - mix run -e 'Depdep.CLI.main(["--sweep", "--grace", "0", "--confirm", "--bucket", "depdep-ci"])' 2>&1 | tee /tmp/sweep.log
    - grep -qE 'removed 1040 of 1040' /tmp/sweep.log
    - mix run -e 'Depdep.CLI.main(["--report"])' 2>&1 | tee /tmp/after.log
    - grep -qE '^depdep:.v3\s+10 objects.*10 reachable, 0 not' /tmp/after.log

# Everything a hex publish would do, done locally, on every tag — package,
# docs through the ex_doc escript (deps/0 stays empty), hex's own checks — so
# the day a real publish is wanted (#73) nothing is being tried for the first
# time. `--dry-run` still insists on a key; the placeholder is never sent
# anywhere, and if hex ever did send it the 401 would be the right failure.
# MIX_ENV=prod, not the pipeline's test: under test the beams include
# test/support and the docs would document the fixtures.
hex-dry-run:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    MIX_ENV: prod
    HEX_API_KEY: dry-run
  script:
    - mix escript.install hex ex_doc --force
    - mix hex.publish --dry-run --yes
  artifacts:
    paths: [doc/]
    expire_in: 1 week

# The real thing, and it does not exist until somebody sets HEX_API_KEY
# (protected, masked) — the publish is a later decision (#73), so until then
# a tag pipeline has no job that could fail for want of a key. Hex refuses a
# version it already has, so a tag whose @version did not move (#40) stops here.
publish-hex:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $HEX_API_KEY
  variables:
    MIX_ENV: prod
  script:
    - mix escript.install hex ex_doc --force
    - mix hex.publish --yes
