# Depdep has no dependencies, so there is nothing to fetch and nothing to cache.
# The whole pipeline is compile + format + test.
default:
  image: hexpm/elixir:1.20.4-erlang-29.0.5-debian-bookworm-20260824
  interruptible: true
  before_script:
    # The image ships no git, and the runner clones with its own, outside this
    # container — so nothing needed one until Depdep.Provider.GitTest started
    # shelling out to it. Those tests are what stands between a restored mirror
    # and `git fsck` rejecting it, so install git rather than exclude them.
    - apt-get update && apt-get install -y --no-install-recommends git
    - mix local.hex --force && mix local.rebar --force

variables:
  MIX_ENV: test
  # See the note in dco-tek/bizex's .gitlab-ci.yml: ERTS sizes the port table
  # from the file-descriptor limit, and the runner's containers inherit an
  # effectively infinite `nofile`, so every BEAM allocates ~1.5 GB before
  # running an instruction.
  ERL_MAX_PORTS: "65536"

stages: [test, store, publish]

test:
  stage: test
  script:
    - mix format --check-formatted
    - mix compile --warnings-as-errors
    - mix test
    # The metresis profile (priv/profiles/depdep.exs) is held to what the code
    # emits, both ways — a metric added without it would post as a bare
    # provisional again (#69). The suite runs the same check; this is the line
    # a reader of a red pipeline sees.
    - mix depdep.profile check
    # And what the instance actually holds. Drift detection, not authority: a
    # difference fails the job; an unreachable or unconfigured instance is one
    # line and a pass (#100).
    #
    # Be clear about what this is worth TODAY: this runner cannot resolve the
    # host in DEPDEP_METRESIS_URL (nxdomain, the same as every consumer job's
    # "metrics not reported" line), so it compares nothing and passes. It is
    # a real gate wherever the instance resolves — an operator's shell now,
    # this job the day the runner's DNS reaches it. Left in because it costs
    # nothing and arms itself; read the line in the log rather than assuming.
    - mix depdep.profile check --instance
    # The package metadata and its file list (mix.exs package/0) are held to
    # what hex accepts, so `mix hex.publish` cannot be the first thing to find
    # a field missing (#75). Builds a tarball and writes nothing else.
    - mix hex.build --output /tmp/depdep-package.tar

# The claim #14 shipped without: that `apt-get install` USES a restored `.deb`
# rather than re-fetching it. #41 recorded it as untakeable — "no MinIO was
# reachable and the environment was not root" — which is false of this job: it
# runs as root, and it can run a store beside it.
#
# **The store here is a mock, and that is on purpose.** MinIO cannot be had
# any more: `minio/minio` is gone from Docker Hub ("repository does not
# exist"), `quay.io/minio/minio` answers unauthorized, and
# `dl.min.io/.../minio` returns 410 — all three checked in this job's own
# history (#105, and see the proposal on what that means for the README).
# `adobe/s3mock` hands objects back and takes `initialBuckets`, which is all
# this job needs: what is under test is apt's behaviour, not the store's. It
# does NOT validate signatures, so nothing here is evidence about Signature
# v4 — the reclamation job (#106) needs a server that does, and picks one.
.store:
  stage: store
  services:
    - name: adobe/s3mock
      alias: s3
  variables:
    # The URL form (#88) driving a real HTTP server for the first time.
    DEPDEP_STORE: "s3://depdep@s3:9090/depdep-ci"
    DEPDEP_SECRET_KEY: depdep-ci-secret
  before_script:
    # Debian images delete a downloaded .deb the moment it is unpacked, which
    # would empty the archives directory before the push could see it. The
    # same line metresis and uficap already carry.
    - rm -f /etc/apt/apt.conf.d/docker-clean
    - apt-get update
    - apt-get install -y --no-install-recommends git curl
    - mix local.hex --force && mix local.rebar --force
    - |
      for _ in $(seq 1 60); do
        curl -sf http://s3:9090/ > /dev/null 2>&1 && break
        sleep 1
      done
      # The bucket, explicitly. `initialBuckets` did not take (this image
      # reads it under some other name), and an unsigned PUT works precisely
      # because s3mock does not check authorization — the same property that
      # makes it useless as evidence about signing, said plainly here.
      curl -sf -X PUT http://s3:9090/depdep-ci

apt-round-trip:
  extends: .store
  variables:
    PKGS: tree
  script:
    # 1. Fill the archives directory, and prove the assertion discriminates:
    #    a fetch from Debian DOES print `Get:` lines. If this control ever
    #    stops printing them, step 4 proves nothing.
    - apt-get install -d -y $PKGS 2>&1 | tee /tmp/download.log
    - grep -q '^Get:' /tmp/download.log
    - test -n "$(ls /var/cache/apt/archives/*.deb 2>/dev/null)"

    # 2. Into the store, and out of the cache.
    - mix run -e 'Depdep.CLI.main(["--push", "--provider", "apt"])'
    - rm -f /var/cache/apt/archives/*.deb

    # 3. Back from the store.
    - mix run -e 'Depdep.CLI.main(["--pull", "--provider", "apt", "--package", "tree"])'
    - test -n "$(ls /var/cache/apt/archives/*.deb 2>/dev/null)"

    # 4. The claim: apt installs from what depdep restored, fetching nothing.
    #    `Setting up` too, so "no Get:" cannot pass because nothing installed.
    - apt-get install -y $PKGS 2>&1 | tee /tmp/install.log
    - "! grep -q '^Get:' /tmp/install.log"
    - grep -q 'Setting up tree' /tmp/install.log

    # These have existed since #14 and have never run anywhere: `mix test`
    # excludes them so the suite stays hermetic on a machine with no apt.
    - mix test --include apt_integration

# Everything a hex publish would do, done locally, on every tag — package,
# docs through the ex_doc escript (deps/0 stays empty), hex's own checks — so
# the day a real publish is wanted (#73) nothing is being tried for the first
# time. `--dry-run` still insists on a key; the placeholder is never sent
# anywhere, and if hex ever did send it the 401 would be the right failure.
# MIX_ENV=prod, not the pipeline's test: under test the beams include
# test/support and the docs would document the fixtures.
hex-dry-run:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    MIX_ENV: prod
    HEX_API_KEY: dry-run
  script:
    - mix escript.install hex ex_doc --force
    - mix hex.publish --dry-run --yes
  artifacts:
    paths: [doc/]
    expire_in: 1 week

# The real thing, and it does not exist until somebody sets HEX_API_KEY
# (protected, masked) — the publish is a later decision (#73), so until then
# a tag pipeline has no job that could fail for want of a key. Hex refuses a
# version it already has, so a tag whose @version did not move (#40) stops here.
publish-hex:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $HEX_API_KEY
  variables:
    MIX_ENV: prod
  script:
    - mix escript.install hex ex_doc --force
    - mix hex.publish --yes
